services:
  controller:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      RECOVERYPROOF_API_KEY: ${RECOVERYPROOF_API_KEY:?Set in .env}
      RECOVERYPROOF_DB: /data/runs.db
      RECOVERYPROOF_TARGET_URL: http://target:8001
      RECOVERYPROOF_TARGET_CONTAINER: recoveryproof-target
      RECOVERYPROOF_TARGET_HOOK_KEY: ${RECOVERYPROOF_API_KEY:?Set in .env}
    volumes:
      - recoveryproof-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - target
    restart: unless-stopped
  target:
    build:
      context: .
      dockerfile: target.Dockerfile
    container_name: recoveryproof-target
    labels:
      recoveryproof.scope: demo-target
    environment:
      RECOVERYPROOF_TARGET_HOOK_KEY: ${RECOVERYPROOF_API_KEY:?Set in .env}
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=1)"]
      interval: 2s
      timeout: 1s
      retries: 3
volumes:
  recoveryproof-data:
